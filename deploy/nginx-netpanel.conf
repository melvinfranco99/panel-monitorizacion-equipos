# nginx como proxy inverso delante de gunicorn, con HTTPS.
#   sudo cp deploy/nginx-netpanel.conf /etc/nginx/sites-available/netpanel
#   sudo ln -s /etc/nginx/sites-available/netpanel /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Certificado: en una red interna, uno de la CA de la empresa o autofirmado:
#   sudo openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
#     -keyout /etc/ssl/private/netpanel.key -out /etc/ssl/certs/netpanel.crt \
#     -subj "/CN=netpanel.empresa.local"

server {
    listen 80;
    server_name netpanel.empresa.local;
    return 301 https://$host$request_uri;   # todo a HTTPS
}

server {
    listen 443 ssl;
    server_name netpanel.empresa.local;

    ssl_certificate     /etc/ssl/certs/netpanel.crt;
    ssl_certificate_key /etc/ssl/private/netpanel.key;

    # Solo la red de administración puede ver el panel
    allow 192.168.10.0/24;
    deny  all;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
